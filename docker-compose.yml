# Local / single-host deployment: bridge + PostgreSQL 18 + Redis 8.
# Copy .env.example to .env and fill in the secrets first.
services:
  bridge:
    build: .
    image: ghcr.io/sketchain/oxalate-bridge:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BRIDGE_LISTEN: ":8080"
      BRIDGE_DATABASE_URL: "postgres://bridge:${POSTGRES_PASSWORD}@postgres:5432/bridge?sslmode=disable"
      BRIDGE_REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped
    # Balances, quota holds and the settlement stream live here: persist them
    # (AOF) and never evict.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
