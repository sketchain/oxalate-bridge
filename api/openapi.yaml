  /admin/overview:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminGetOverview
      summary: Everything the admin overview page shows, in one call.
      description: |
        "Today" is the current day in the server time zone (`BRIDGE_TIMEZONE`,
        default Asia/Shanghai), counted from the request logs. Account counts are
        disjoint: `penalized` counts accounts that are otherwise normal but whose
        5-hour usage is at or above their watermark (routing weight reduced).
      responses:
        '200':
          description: Overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        default: { $ref: '#/components/responses/Error' }

  /admin/accounts/validate:
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminValidateAccount
      summary: Check a connection without saving anything (the import dialog's first step).
      description: |
        Calls /quota and /v1/models exactly like an import and returns what was
        detected (instance, subscription, tier, auth_index). Always 200; `ok` tells
        whether an import with the same values would pass.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountValidateRequest' }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTestResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/accounts:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminListAccounts
      responses:
        '200':
          description: Upstream accounts with their live status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminCreateAccount
      summary: Import an account. /quota and /v1/models must both succeed before it is saved.
      description: |
        /quota must be served by cpa-quota v0.1.0 or later and list the account (set
        `auth_indexes` in cpa-quota so each CPA reports exactly one account); otherwise the
        import fails with 422 `upstream_validation_failed` ("quota response lists no account").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminGetAccount
      responses:
        '200':
          description: The account with live status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminUpdateAccount
      summary: Edit an account. The edited connection is validated like an import; saving clears the error state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminDeleteAccount
      summary: Delete an account (soft delete).
      description: |
        Refused with 409 `account_has_subscriptions` while subscriptions with status
        `active` or `pending_assignment` are bound to the account; the error lists them
        in `error.subscriptions`. Rebind or cancel them first. Disabling is always allowed.
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/enabled:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminSetAccountEnabled
      summary: Enable or disable; enabling also clears the error state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnabledRequest' }
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/test:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-accounts]
      operationId: adminTestAccount
      summary: Call /quota and /v1/models now; a full pass clears the error state and cooldown.
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTestResult' }
        default: { $ref: '#/components/responses/Error' }

  /admin/accounts/{accountId}/estimate:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminGetAccountEstimate
      summary: The account's row of the cpa-quota `estimates` table (read only).
      description: |
        Located by the account's `instance` and `auth_index`. `detail` is the full
        account object JSON exactly as cpa-quota stored it. 404 when cpa-quota has
        no estimate for the account yet; 503 `cpa_quota_unavailable` when the
        cpa-quota schema or table is missing or the query times out.
      responses:
        '200':
          description: The estimate row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpaQuotaEstimate' }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/k-trend:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminGetAccountKTrend
      summary: Rows of the cpa-quota `k_trend_daily` table for the account (read only).
      parameters:
        - name: days
          in: query
          description: Days back from today (UTC), today included.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Daily k trend, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KTrend' }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/quota-series:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminGetAccountQuotaSeries
      summary: Reported utilization of one window over time (cpa-quota `quota_report_windows`, read only).
      description: |
        Rows with `limit_key = 'unified'` and `seconds` = 18000 (`5h`) or 604800 (`7d`),
        ordered by time. When more than 2000 points fall in the range, the range is cut
        into 2000 equal time buckets and the last point of each bucket is returned
        (`downsampled` = true).
      parameters:
        - name: window
          in: query
          required: true
          schema: { type: string, enum: [5h, 7d] }
        - name: from
          in: query
          description: Default `to` − 7 days for `5h`, `to` − 30 days for `7d`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Default now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaSeries' }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/cost-compare:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-accounts]
      operationId: adminGetAccountCostCompare
      summary: Upstream cost per time bucket as seen by cpa-quota and by this bridge.
      description: |
        For each UTC bucket: the sum of cpa-quota `requests.cost_usd` with
        `accounting = 'complete'` (bucketed by request start, `requested_ns`) next to the
        sum of this bridge's `usage_hourly.upstream_cost_micro` for the account
        (bucketed by request start hour). Requests the CPA instance served without
        going through the bridge only appear on the cpa-quota side.
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: bucket
          in: query
          schema: { type: string, enum: [hour, day], default: hour }
      responses:
        '200':
          description: Side-by-side costs, oldest bucket first; buckets with no data on either side are omitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCompare' }
        default: { $ref: '#/components/responses/Error' }

  /admin/plans:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
