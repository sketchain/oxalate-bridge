      required: [request_id, created_at, tier, endpoint, model_raw, model, stream, status_code, error_type, input_tokens, cache_read_tokens, cache_write_tokens, output_tokens, reasoning_tokens, billed_micro, unpriced, usage_missing, latency_ms, first_byte_ms, user_agent]
      properties:
        request_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        key_id: { type: string, format: uuid, nullable: true }
        tier: { type: string, description: 'plan, standard, force, or empty when no tier admitted the request.' }
        subscription_id: { type: string, format: uuid, nullable: true }
        endpoint: { type: string }
        model_raw: { type: string }
        model: { type: string }
        stream: { type: boolean }
        status_code: { type: integer }
        error_type: { type: string }
        input_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        reasoning_tokens: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
        unpriced: { type: boolean }
        usage_missing: { type: boolean }
        latency_ms: { type: integer }
        first_byte_ms: { type: integer }
        user_agent: { type: string }
    MyRequestLogPage:
