        remaining_micro: { type: integer, format: int64, description: Real-time remaining quota (Redis). }
    MySubscription:
      type: object
      description: A subscription as its owner sees it (no account, no upstream cost).
      required: [id, plan_id, plan_name, subscription, weekly_quota_micro, allowed_models, duration_value, duration_unit, price_micro, status, auto_renew, created_at]
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string }
        subscription: { $ref: '#/components/schemas/SubscriptionKind' }
        weekly_quota_micro: { type: integer, format: int64 }
        allowed_models:
          type: array
          items: { type: string }
        duration_value: { type: integer }
        duration_unit: { $ref: '#/components/schemas/DurationUnit' }
        price_micro: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        activated_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        auto_renew: { type: boolean }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        current_period:
          allOf:
            - $ref: '#/components/schemas/MyPeriodUsage'
          nullable: true
