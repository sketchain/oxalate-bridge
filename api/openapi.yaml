        status: { $ref: '#/components/schemas/RedeemCodeStatus' }
        amount_micro: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        used_by: { type: string, format: uuid, nullable: true }
        used_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    RedeemCodePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RedeemCode' }
        next_cursor: { type: string, nullable: true }
    AnnouncementLevel:
      type: string
      enum: [info, warning]
    AnnouncementInput:
