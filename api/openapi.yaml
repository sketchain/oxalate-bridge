        segment_window: { type: string }
        basis: { type: string }
        k: { type: number, format: double, nullable: true }
        k_source: { type: string }
        totals_from: { type: string }
        safety_factor: { type: number, format: double }
        used_5h: { type: number, format: double }
        reset_5h: { type: string, format: date-time, nullable: true }
        used_7d: { type: number, format: double }
        reset_7d: { type: string, format: date-time, nullable: true }
        five_hour_total_usd: { type: number, format: double }
        weekly_total_usd: { type: number, format: double }
        remaining_five_hour_usd: { type: number, format: double }
        remaining_week_usd: { type: number, format: double }
        clean_blocks: { type: integer }
        total_blocks: { type: integer }
        segments: { type: integer }
