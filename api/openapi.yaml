      required: [account_id]
      properties:
        account_id: { type: string, format: uuid }
    CancelSubscriptionRequest:
      type: object
      required: [refund_micro]
      properties:
        refund_micro: { type: integer, format: int64, minimum: 0 }
        note: { type: string }

