        limit_5h_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 5-hour limit; null = unlimited. }
        limit_1d_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 24-hour limit; null = unlimited. }
        limit_7d_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 7-day limit; null = unlimited. }
