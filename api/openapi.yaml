        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }
    Announcement:
      type: object
      required: [id, title, body, level, enabled, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }
        active: { type: boolean, description: Enabled and inside its time window now. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnnouncementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Announcement' }
    TokenPrices:
      type: object
      description: Micro-USD per 1,000,000 tokens.
      required: [input, output, cache_read, cache_write]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        cache_write: { type: integer, format: int64 }
    ModelPricing:
      type: object
      required: [model, priced, model_multiplier]
      properties:
        model: { type: string }
        priced: { type: boolean, description: False when the ratio table has no price for the model (requests are then not billed by tokens). }
        model_multiplier: { type: number, format: double }
        plan: { $ref: '#/components/schemas/TokenPrices' }
        standard: { $ref: '#/components/schemas/TokenPrices' }
        force: { $ref: '#/components/schemas/TokenPrices' }
    Pricing:
      type: object
      required: [items, tier_multipliers]
      properties:
        tier_multipliers: { $ref: '#/components/schemas/TierMultipliers' }
        items:
          type: array
          description: 'Union of the models of enabled accounts. Price = toll rate (model_ratio × 2 USD, × completion / cache / create_cache ratio) × tier multiplier × model multiplier.'
          items: { $ref: '#/components/schemas/ModelPricing' }
