          in: query
          schema: { type: string }
      responses:
        '200':
          description: Audit log entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-events:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminListSafeguardEvents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserIdFilter'
        - name: prompt_hash
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Safeguard (Claude refusal) events, newest first; prompt cut to 500 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardEventPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminGetSafeguardEvent
      responses:
        '200':
          description: The event with the whole normalized prompt (body not included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardEvent' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-events/{eventId}/body:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminGetSafeguardEventBody
      summary: One chunk of the stored request body (the first chunk read is audited).
      description: |
        The body is stored gzip-compressed; this returns up to `limit` bytes
        of the original JSON from `offset`, cut on a UTF-8 boundary. Pass
        `next_offset` back as `offset`; it is null at the end.
      parameters:
        - name: offset
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, format: int64, minimum: 1024, maximum: 1048576, default: 65536 }
      responses:
        '200':
          description: The chunk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardBodyChunk' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-events/{eventId}/raw:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminDownloadSafeguardEventBody
      summary: The whole stored request body as a file (audited).
      responses:
        '200':
          description: The original request body (JSON), as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-blocks:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminListSafeguardBlocks
      summary: The prompt blocklist (hash and prompt), newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [all, active, revoked], default: active }
        - name: q
          in: query
          description: Substring of the prompt, or an exact hash.
          schema: { type: string }
      responses:
        '200':
          description: Entries; prompt cut to 500 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardBlockPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-blocks/{hash}:
    parameters:
      - $ref: '#/components/parameters/BlockHash'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminGetSafeguardBlock
      responses:
        '200':
          description: The entry with the whole prompt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardBlock' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-blocks/{hash}/revoke:
    parameters:
      - $ref: '#/components/parameters/BlockHash'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-safeguard]
      operationId: adminRevokeSafeguardBlock
      summary: Take a prompt off the blocklist (a false positive). Audited.
      responses:
        '200':
          description: The revoked entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardBlock' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-appeals:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-safeguard]
      operationId: adminListSafeguardAppeals
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserIdFilter'
        - name: status
          in: query
          schema: { type: string, enum: [all, pending, approved, rejected], default: all }
      responses:
        '200':
          description: Appeals, newest first, with the pending count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardAppealPage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-appeals/{appealId}/approve:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-safeguard]
      operationId: adminApproveSafeguardAppeal
      summary: Approve a pending appeal; the user's count is cleared and the lock lifted. Audited.
      description: '`safeguard_appeal_decided` (409) when it is no longer pending.'
      responses:
        '200':
          description: The decided appeal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardAppeal' }
        default: { $ref: '#/components/responses/Error' }
  /admin/safeguard-appeals/{appealId}/reject:
    parameters:
      - $ref: '#/components/parameters/AppealId'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-safeguard]
      operationId: adminRejectSafeguardAppeal
      summary: Reject a pending appeal with a reason the user sees. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SafeguardAppealReject' }
      responses:
        '200':
          description: The decided appeal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeguardAppeal' }
        default: { $ref: '#/components/responses/Error' }
  /admin/prices:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminGetPrices
      responses:
        '200':
          description: Ratio table status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceStatus' }
        default: { $ref: '#/components/responses/Error' }
  /admin/prices/refresh:
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminRefreshPrices
      responses:
        '200':
          description: Ratio table status after the refresh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceStatus' }
        default: { $ref: '#/components/responses/Error' }
  /admin/reconcile:
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminRunReconcile
      summary: Run the ledger / balance / charge reconciliation now.
      responses:
        '200':
          description: Reconcile result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }
        default: { $ref: '#/components/responses/Error' }
  /admin/redeem-batches:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminListRedeemBatches
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batches, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemBatchPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminCreateRedeemBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemBatchCreate' }
      responses:
        '201':
          description: Created batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemBatch' }
        default: { $ref: '#/components/responses/Error' }
  /admin/redeem-batches/{batchId}/export:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminExportRedeemBatch
      summary: CSV of every code of a batch, original text included (audited).
      responses:
        '200':
          description: CSV (code,amount_usd,status,used_by,used_at,expires_at).
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /admin/redeem-codes:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminListRedeemCodes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: batch_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RedeemCodeStatus' }
      responses:
        '200':
          description: Codes (masked), newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemCodePage' }
        default: { $ref: '#/components/responses/Error' }
  /admin/redeem-codes/{codeId}/void:
    parameters:
      - name: codeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminVoidRedeemCode
      responses:
        '200':
          description: Voided code (only unused codes can be voided).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemCode' }
        default: { $ref: '#/components/responses/Error' }
  /admin/announcements:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminListAnnouncements
      responses:
        '200':
          description: All announcements, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminCreateAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        default: { $ref: '#/components/responses/Error' }
  /admin/announcements/{announcementId}:
    parameters:
      - $ref: '#/components/parameters/AnnouncementId'
    patch:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminUpdateAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-system]
      operationId: adminDeleteAnnouncement
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Error' }
  /admin/admin-tokens:
    get:
      security: [{ cookieAuth: [] }]
      x-admin-token-scope: none
      tags: [admin-system]
      operationId: adminListAdminTokens
      responses:
        '200':
          description: Every admin token (revoked ones included), newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTokenList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }]
      x-admin-token-scope: none
      tags: [admin-system]
      operationId: adminCreateAdminToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTokenCreate' }
      responses:
        '201':
          description: The token; `secret` is returned only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTokenCreated' }
        default: { $ref: '#/components/responses/Error' }
  /admin/admin-tokens/{tokenId}/revoke:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      security: [{ cookieAuth: [] }]
      x-admin-token-scope: none
      tags: [admin-system]
      operationId: adminRevokeAdminToken
      responses:
        '200':
          description: The revoked token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminToken' }
        default: { $ref: '#/components/responses/Error' }
  /admin/events:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-system]
      operationId: adminEvents
      summary: Server-sent events across replicas.
      description: |
        `text/event-stream`. Available to read-scope admin tokens. Event names: `account_status` (data:
        `AccountStatusEvent`) and `request_settled` (data: `RequestSettledEvent`).
        A comment line is sent every 15 s.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bridge_session
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: oba-
      description: Admin API token (`oba-` + 43 base62 characters), `/admin/*` only; see `x-admin-token-scope` on each operation.

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: Validate and report capacity and warnings without changing anything.
      schema: { type: boolean, default: false }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppealId:
      name: appealId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlockHash:
      name: hash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    KeyIdFilter:
      name: key_id
      in: query
      schema: { type: string, format: uuid }
    UserIdFilter:
      name: user_id
      in: query
      schema: { type: string, format: uuid }
    AccountIdFilter:
      name: account_id
      in: query
      schema: { type: string, format: uuid }
    ModelFilter:
      name: model
      in: query
      description: Normalized model name.
      schema: { type: string }
    TierFilter:
      name: tier
      in: query
      schema: { $ref: '#/components/schemas/Tier' }
    LedgerTypeFilter:
      name: type
      in: query
      schema: { $ref: '#/components/schemas/LedgerType' }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    FromRequired:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    Granularity:
      name: granularity
      in: query
      required: true
      schema: { type: string, enum: [hour, day] }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Fixed codes: bad_request, validation_failed, unauthorized,
                forbidden, csrf_header_missing, not_found, conflict,
                rate_limited, insufficient_balance, invalid_state,
                upstream_validation_failed, unsupported_subscription,
                account_has_subscriptions, cpa_quota_unavailable, redeem_code_invalid,
                redeem_code_used, redeem_code_void, redeem_code_expired, redeem_locked,
                admin_token_invalid, admin_token_expired, admin_token_revoked,
                admin_token_ip_denied, admin_token_read_only, admin_token_forbidden,
                admin_token_rate_limited, push_unavailable,
                safeguard_no_reset_card, safeguard_nothing_to_reset,
                safeguard_not_locked, safeguard_appeal_pending,
                safeguard_appeal_decided, internal.
            message: { type: string }
            subscriptions:
              type: array
              description: Only with `account_has_subscriptions`; the subscriptions that block the delete.
              items: { $ref: '#/components/schemas/BlockingSubscription' }

    Role:
      type: string
      enum: [admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    Tier:
      type: string
      enum: [plan, standard, force]
    LedgerType:
      type: string
      enum: [admin_topup, admin_adjust, plan_purchase, plan_renewal, api_charge, refund, redeem]
    SubscriptionKind:
      type: string
      description: Only Claude subscriptions are served (since v0.2.0).
      enum: [claude]
    SubscriptionStatus:
      type: string
      enum: [pending_assignment, active, expired, cancelled]
    DurationUnit:
      type: string
      enum: [day, week, month]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 256 }
    Me:
      type: object
      required: [id, username, role, status, balance_micro, max_concurrency, locale, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        balance_micro: { type: integer, format: int64 }
        max_concurrency: { type: integer }
        rpm: { type: integer, nullable: true }
        locale: { $ref: '#/components/schemas/Locale' }
        created_at: { type: string, format: date-time }
    Locale:
      type: string
      enum: [zh-CN, en]
    LocaleUpdate:
      type: object
      required: [locale]
      properties:
        locale: { $ref: '#/components/schemas/Locale' }

    QuotaScope:
      type: string
      description: 'What counts toward the key quota and windows: all = every billed charge (plan quota and balance), balance = only charges of the standard / force tiers.'
      enum: [all, balance]
    KeyStatusValue:
      type: string
      description: 'active, disabled (key or its user disabled) or expired.'
      enum: [active, disabled, expired]
    ApiKey:
      type: object
      required: [id, name, prefix, tiers, enabled, note, created_at, status, quota_scope, allow_owner_query, used_all_micro, used_balance_micro]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Display form such as sk-AbCd…wxyz. }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        subscription_id: { type: string, format: uuid, nullable: true }
        max_concurrency: { type: integer, nullable: true }
        rpm: { type: integer, nullable: true }
        enabled: { type: boolean }
        note: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/KeyStatusValue' }
        quota_limit_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Total quota since the last reset; null = unlimited. }
        quota_scope: { $ref: '#/components/schemas/QuotaScope' }
        limit_5h_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 5-hour limit; null = unlimited. }
        limit_1d_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 24-hour limit; null = unlimited. }
        limit_7d_micro: { type: integer, format: int64, minimum: 0, nullable: true, description: Sliding 7-day limit; null = unlimited. }
        expires_at: { type: string, format: date-time, nullable: true }
        model_allowlist:
          type: array
          nullable: true
          description: Allowed models (normalized names); null = every model. /v1/models is filtered too.
          items: { type: string }
        ip_allowlist:
          type: array
          nullable: true
          description: Allowed client IPs or CIDR prefixes (the real client IP per the trusted proxies); null = any.
          items: { type: string }
        allow_owner_query: { type: boolean, description: Lets the key read its owner's balance and plan figures (public key query and status line). }
        used_all_micro: { type: integer, format: int64, description: Persisted usage since the last reset, all charges (real-time figures are in KeyLimitStatus). }
        used_balance_micro: { type: integer, format: int64, description: Persisted usage since the last reset, balance tiers only. }
        usage_reset_at: { type: string, format: date-time, nullable: true, description: Last reset (null = never). }
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key: { type: string }
    ApiKeySecret:
      type: object
      required: [key]
      properties:
        key: { type: string }
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
