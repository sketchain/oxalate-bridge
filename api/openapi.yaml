        next_cursor: { type: string, nullable: true }
    SubscriptionWithWarning:
      type: object
      required: [subscription, dry_run, capacity, warnings, warning]
      properties:
        subscription:
          allOf:
            - $ref: '#/components/schemas/Subscription'
          nullable: true
          description: The subscription after the operation; null for a dry run.
        dry_run: { type: boolean }
        capacity: { $ref: '#/components/schemas/BindCapacity' }
        warnings:
          type: array
          description: Warnings of the operation (never blocking). A dry run returns exactly the warnings the real call would.
          items: { $ref: '#/components/schemas/BindWarning' }
        warning:
          type: string
          nullable: true
          description: Deprecated — the messages of `warnings` joined with "; ", null when there is none.
    BindCapacity:
      type: object
      description: The account's sold capacity as it is after the operation (this subscription included).
      required: [account_id, subscription_quota_micro, sold_weekly_quota_micro, sold_upstream_micro, week_total_micro, plan_multiplier]
      properties:
        account_id: { type: string, format: uuid }
        subscription_quota_micro: { type: integer, format: int64, description: Weekly quota (user price) of the subscription being bound. }
        sold_weekly_quota_micro: { type: integer, format: int64, description: Σ weekly quota (user price) of the active and pending subscriptions on the account, this one included. }
        sold_upstream_micro: { type: integer, format: int64, description: sold_weekly_quota_micro ÷ the plan tier multiplier (upstream terms). }
        week_total_micro: { type: integer, format: int64, nullable: true, description: The account's week.total_usd; null when unknown. }
        plan_multiplier: { type: number, format: double }
    BindWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `overcommit` (sold upstream exceeds the week total), `week_total_unknown` (no week
            total reported yet), `account_not_normal` (the account is stale, cooling down, full
            or in error). Clients must cope with codes they do not know.
        message: { type: string, description: English text for clients that do not know the code. }
    AutoRenewRequest:
      type: object
      required: [auto_renew]
      properties:
        auto_renew: { type: boolean }
    GrantSubscriptionRequest:
      type: object
      required: [user_id, plan_id, account_id]
      properties:
        user_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        charge: { type: boolean, default: false, description: Charge the plan price to the user's balance. }
    AccountRef:
