  /admin/subscriptions:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-subscriptions]
      operationId: adminListSubscriptions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/AccountIdFilter'
      responses:
        '200':
          description: Subscriptions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-subscriptions]
      operationId: adminGrantSubscription
      summary: Open an active subscription for a user directly on an account, optionally charging the price.
      description: |
        With `dry_run=true` the request is fully validated (user, plan, account) and the
        capacity figures and warnings are returned with status 200 and `subscription: null`;
        nothing is written. Without it the warnings are exactly the ones a dry run returns.
      parameters:
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantSubscriptionRequest' }
      responses:
        '200':
          description: Dry run only (`dry_run=true`) — capacity and warnings, nothing created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionWithWarning' }
        '201':
          description: Created subscription, with capacity figures and warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionWithWarning' }
        default: { $ref: '#/components/responses/Error' }
  /admin/subscriptions/{subscriptionId}/assign:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-subscriptions]
      operationId: adminAssignSubscription
      summary: Activate a pending subscription on an account (warns, never blocks, on overcommit).
      description: |
        With `dry_run=true` the request is fully validated and only the capacity figures and
        warnings are returned (`subscription: null`); nothing is written.
      parameters:
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRef' }
      responses:
        '200':
          description: Activated subscription (or the dry-run result).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionWithWarning' }
        default: { $ref: '#/components/responses/Error' }
  /admin/subscriptions/{subscriptionId}/rebind:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-subscriptions]
      operationId: adminRebindSubscription
      summary: Move an active or pending subscription to another account (warns, never blocks, on overcommit).
      description: |
        With `dry_run=true` the request is fully validated and only the capacity figures and
        warnings are returned (`subscription: null`); nothing is written.
      parameters:
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRef' }
      responses:
        '200':
          description: Rebound subscription (or the dry-run result).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionWithWarning' }
        default: { $ref: '#/components/responses/Error' }
  /admin/subscriptions/{subscriptionId}/cancel:
    parameters:
