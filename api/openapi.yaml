openapi: 3.0.3
info:
  title: oxalate-bridge panel API
  version: 0.6.0
  description: |
    Panel API of oxalate-bridge. This file is the single source of truth: the
    backend server code is generated from it with oapi-codegen (chi strict
    server) and must implement it as written.

    Conventions:
    - All amounts are integers in micro-USD (1e-6 USD).
    - Times are RFC 3339 in UTC. IDs are UUIDv7.
    - Lists are cursor paginated: pass `next_cursor` back as `cursor`.
    - Errors are `{"error":{"code","message"}}` with a fixed `code` string.
    - Authentication is a session cookie (`bridge_session`, HttpOnly,
      SameSite=Lax) set by `POST /auth/login`.
    - `/admin/*` also accepts an admin API token: `Authorization: Bearer oba-…`
      (scheme `adminToken`). Tokens are created by an admin in the panel; the
      full token is shown once. Token requests skip the `X-Requested-With`
      check. Each admin operation carries `x-admin-token-scope`: `read`
      (GET / HEAD, including the SSE stream: read and write tokens), `write`
      (write tokens only) or `none` (session only: managing admin tokens).
      Changing a user's role, creating an admin user, setting an admin's
      password, disabling an admin and deleting an admin are refused for
      every token (`admin_token_forbidden`, 403).
      Token errors: `admin_token_invalid`, `admin_token_expired`,
      `admin_token_revoked` (401), `admin_token_ip_denied`,
      `admin_token_read_only`, `admin_token_forbidden` (403),
      `admin_token_rate_limited` (429, per token, `admin_token_per_minute`
      setting, default 120). Writes made with a token are audited with the
      token's id and name; `operator_id` is its creator.
    - Every non-GET request must carry the header `X-Requested-With`
      (any value, e.g. `XMLHttpRequest`) or it is rejected with
      `csrf_header_missing` (403).
    - `/admin/*` requires the `admin` role; admin writes are audited.
    - Endpoints for ordinary users never expose upstream cost, multipliers or
      anything about upstream accounts: they use their own `My*` schemas
      (`MyRequestLog`, `MyUsageBucket`, `MySubscription`), while the admin
      endpoints keep the full ones (`RequestLog`, `UsageBucket`, `Subscription`).

    The relay endpoints (`/v1/messages`, `/v1/messages/count_tokens`,
    `GET /v1/models`; Claude Messages protocol only) are not part of this API.
    `GET /v1/bridge/status` (relay domain, API key auth exactly as /v1/messages,
    not billed or logged, rate limited separately per key by the `status_key_per_minute` setting, default 60) returns a `KeyStatus`.

    Safeguard: before any tier is tried, a user whose safeguard count reached
    the allowance is refused locally with `safeguard_locked` (403,
    permission_error), and a /v1/messages request whose normalized last user
    message is on the site-wide blocklist with `safeguard_prompt_blocked`
    (400, invalid_request_error; not sent upstream, allowance untouched).
    Neither falls through to another tier. A Claude safety refusal (an error
    answer, `stop_reason: refusal`, or a refusal inside a stream) is passed
    to the client as is, stored with the full request body and counted.

    Relay rejections caused by the key itself are Anthropic-shaped errors and never
    fall through to the next tier: `key_expired` (403, permission_error),
    `ip_not_allowed` (403, permission_error), `model_not_allowed` (403,
    permission_error), and, for keys with `quota_scope = all`,
    `key_quota_exhausted` (429, rate_limit_error) and `key_window_exhausted`
    (429, rate_limit_error; `window` and `recovers_at` say which window and when
    it is expected to allow requests again). The code is in `error.code` and is
    also the request log's `error_type`.

    For keys with `quota_scope = balance` an exhausted total quota or window only
    takes the standard and force tiers out of the request's tier chain; the plan
    tier is still tried. Those tiers are reported with the code
    `key_balance_quota_exhausted` (plus `window` and `recovers_at` when a window
    caused it). When no tier admits the request the answer is the usual 429
    (rate_limit_error) whose `error.rejections` lists every tier with its code.
servers:
  - url: /api/v1
security:
  - cookieAuth: []

tags:
  - name: auth
  - name: keys
  - name: billing
  - name: plans
  - name: usage
  - name: admin-users
  - name: admin-accounts
  - name: admin-plans
  - name: admin-subscriptions
  - name: admin-system
  - name: notifications
  - name: safeguard
  - name: admin-safeguard

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Log in with username and password (rate limited).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session.
      responses:
        '204':
          description: Logged out; the cookie is cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /me/password:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed; other sessions stay valid until they expire. }
        default: { $ref: '#/components/responses/Error' }

  /me/locale:
    put:
      tags: [auth]
      operationId: setMyLocale
      summary: Language of push notifications (the panel sends it when the user switches language).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocaleUpdate' }
      responses:
        '204': { description: Saved. }
        default: { $ref: '#/components/responses/Error' }
  /me/safeguard:
    get:
      tags: [safeguard]
      operationId: getMySafeguard
      summary: The caller's safeguard counters, reset cards, lock and latest appeal, and the requests the prompt blocklist stopped.
      responses:
        '200':
          description: Safeguard state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySafeguard' }
        default: { $ref: '#/components/responses/Error' }
  /me/safeguard/reset-card:
    post:
      tags: [safeguard]
      operationId: useSafeguardResetCard
      summary: Spend one reset card to clear the safeguard count (and the lock).
      description: |
        Errors: `safeguard_no_reset_card` (409) when the user has none,
        `safeguard_nothing_to_reset` (409) when the count is already 0.
      responses:
        '200':
          description: State after the reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySafeguard' }
        default: { $ref: '#/components/responses/Error' }
  /me/safeguard/appeals:
    post:
      tags: [safeguard]
      operationId: submitSafeguardAppeal
      summary: Ask an administrator to lift the safeguard lock.
      description: |
        Only while locked (`safeguard_not_locked`, 409) and with no other
        pending appeal (`safeguard_appeal_pending`, 409). Admins get a
        `safeguard_appeal_new` push; the decision comes back as
        `safeguard_appeal_result`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SafeguardAppealCreate' }
      responses:
        '200':
          description: State with the new appeal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySafeguard' }
        default: { $ref: '#/components/responses/Error' }
  /push/config:
    get:
      tags: [notifications]
      operationId: getPushConfig
      responses:
        '200':
          description: VAPID public key for PushManager.subscribe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushConfig' }
        default: { $ref: '#/components/responses/Error' }
  /push/subscriptions:
    get:
      tags: [notifications]
      operationId: listPushSubscriptions
      responses:
        '200':
          description: My devices, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDeviceList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notifications]
      operationId: createPushSubscription
      summary: Register this browser (PushSubscription.toJSON()); an endpoint already registered moves to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionCreate' }
      responses:
        '201':
          description: The device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        default: { $ref: '#/components/responses/Error' }
  /push/subscriptions/{pushSubscriptionId}:
    parameters:
      - name: pushSubscriptionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [notifications]
      operationId: deletePushSubscription
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Error' }
  /push/test:
    post:
      tags: [notifications]
      operationId: sendTestPush
      summary: Queue a test notification to every device of the caller (no dedup, preferences ignored).
      responses:
        '200':
          description: Number of devices the notification was queued for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushTestResult' }
        default: { $ref: '#/components/responses/Error' }
  /notifications/prefs:
    get:
      tags: [notifications]
      operationId: getNotificationPrefs
      responses:
        '200':
          description: Every event the caller can receive with its switch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [notifications]
      operationId: updateNotificationPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefsUpdate' }
      responses:
        '200':
          description: Preferences after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
        default: { $ref: '#/components/responses/Error' }

  /me/availability:
    get:
      tags: [billing]
      operationId: getMyAvailability
      summary: Estimated usable amount for the caller (normal / force calls and own plans).
      description: |
        Estimates only (`estimated` is always true). The account-independent part is
        computed by the leader after every quota refresh and cached; the request itself
        only combines that cache with the caller's balance, multipliers and
        subscriptions. No upstream account names, counts or ids are returned.
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        default: { $ref: '#/components/responses/Error' }
  /keys:
    get:
      tags: [keys]
      operationId: listKeys
      responses:
        '200':
          description: The user's API keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [keys]
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: Created; `key` holds the full secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        default: { $ref: '#/components/responses/Error' }
  /keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      tags: [keys]
      operationId: getKey
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [keys]
      operationId: updateKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyUpdate' }
      responses:
        '200':
          description: Updated key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [keys]
      operationId: deleteKey
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Error' }
  /keys/{keyId}/secret:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      tags: [keys]
      operationId: getKeySecret
      responses:
        '200':
          description: The full key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySecret' }
        default: { $ref: '#/components/responses/Error' }

  /keys/{keyId}/limits:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      tags: [keys]
      operationId: getKeyLimits
      summary: Real-time limits and usage of a key (quota and sliding windows).
      responses:
        '200':
          description: Limit status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyLimitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /keys/{keyId}/reset-usage:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [keys]
      operationId: resetKeyUsage
      summary: Reset the used amount of the total quota to 0 (windows slide on their own and are not affected).
      responses:
        '200':
          description: Updated key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        default: { $ref: '#/components/responses/Error' }
  /keys/{keyId}/usage/daily:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      tags: [usage]
      operationId: getKeyDailyUsage
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Per day (server time zone) and tier, from the hourly rollup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyDailyUsage' }
        default: { $ref: '#/components/responses/Error' }
  /balance:
    get:
      tags: [billing]
      operationId: getBalance
      responses:
        '200':
          description: Balance figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        default: { $ref: '#/components/responses/Error' }
  /ledger:
    get:
      tags: [billing]
      operationId: listMyLedger
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LedgerTypeFilter'
      responses:
        '200':
          description: Ledger entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerPage' }
        default: { $ref: '#/components/responses/Error' }

  /balance/redeem:
    post:
      tags: [billing]
      operationId: redeemCode
      summary: Redeem a code into the balance (rate limited per user; repeated failures lock redemption for a while).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemRequest' }
      responses:
        '200':
          description: Redeemed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemResult' }
        default: { $ref: '#/components/responses/Error' }
  /announcements:
    get:
      tags: [billing]
      operationId: listActiveAnnouncements
      summary: Announcements in effect now that the caller has not dismissed.
      responses:
        '200':
          description: Announcements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementList' }
        default: { $ref: '#/components/responses/Error' }
  /announcements/{announcementId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/AnnouncementId'
    post:
      tags: [billing]
      operationId: dismissAnnouncement
      responses:
        '204': { description: Dismissed for the caller (remembered on the server). }
        default: { $ref: '#/components/responses/Error' }
  /pricing:
    get:
      tags: [usage]
      operationId: getPricing
      summary: Per-million-token prices of every model served by an enabled account, per tier.
      responses:
        '200':
          description: Prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        default: { $ref: '#/components/responses/Error' }
  /public/key-usage:
    get:
      tags: [keys]
      operationId: getPublicKeyUsage
      security: []
      summary: Usage of the API key in the request headers (no login).
      description: |
        The key is read from `Authorization: Bearer` or `x-api-key` only (never from the URL).
        Rate limited per client IP and per key (`public_query_ip_per_minute` / `public_query_key_per_minute` in the runtime settings, default 30 each; changes apply immediately). An unknown or deleted key is a uniform 401;
        a disabled or expired key still answers with its status. `account` is present only
        when the key allows owner queries.
      responses:
        '200':
          description: Key usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicKeyUsage' }
        default: { $ref: '#/components/responses/Error' }
  /plans:
    get:
      tags: [plans]
      operationId: listPlansOnSale
      responses:
        '200':
          description: Plans on sale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        default: { $ref: '#/components/responses/Error' }
  /plans/{planId}/purchase:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [plans]
      operationId: purchasePlan
      summary: Buy a plan with the balance (no overdraft). The subscription waits for an admin to assign an account.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '201':
          description: Subscription created in pending_assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySubscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions:
    get:
      tags: [plans]
      operationId: listMySubscriptions
      responses:
        '200':
          description: The user's subscriptions with their current period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySubscriptionList' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}/renew:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [plans]
      operationId: renewSubscription
      summary: Renew by one duration (charged to the balance; from now when already expired).
      responses:
        '200':
          description: Renewed subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySubscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}/auto-renew:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    put:
      tags: [plans]
      operationId: setAutoRenew
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoRenewRequest' }
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySubscription' }
        default: { $ref: '#/components/responses/Error' }

  /usage/logs:
    get:
      tags: [usage]
      operationId: listMyUsageLogs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/KeyIdFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/TierFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Request logs, newest first (user view, no upstream cost, multipliers or account).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRequestLogPage' }
        default: { $ref: '#/components/responses/Error' }
  /usage/keys:
    get:
      tags: [usage]
      operationId: getMyKeyUsage
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
      responses:
        '200':
          description: Totals per key and the daily series of the top 10 keys by billed amount (from the hourly rollup).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyUsageComparison' }
        default: { $ref: '#/components/responses/Error' }
  /usage/summary:
    get:
      tags: [usage]
      operationId: getMyUsageSummary
      parameters:
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/KeyIdFilter'
      responses:
        '200':
          description: Usage grouped by time bucket, model and tier (from the hourly rollup; user view, no upstream cost).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyUsageSummary' }
        default: { $ref: '#/components/responses/Error' }
  /models:
    get:
      tags: [usage]
      operationId: listModels
      responses:
        '200':
          description: Models served by at least one usable account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        default: { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-users]
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Users, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-users]
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Created user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: read
      tags: [admin-users]
      operationId: adminGetUser
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-users]
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdate' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      security: [{ cookieAuth: [] }, { adminToken: [] }]
      x-admin-token-scope: write
      tags: [admin-users]
      operationId: adminDeleteUser
      responses:
        '204': { description: Soft-deleted; keys stop working. }
        default: { $ref: '#/components/responses/Error' }
  /admin/users/{userId}/balance:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
