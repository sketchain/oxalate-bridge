    UsageBucket:
      type: object
      required: [bucket, model, tier, requests, errors, input_tokens, cache_read_tokens, cache_write_tokens, output_tokens, reasoning_tokens, upstream_cost_micro, billed_micro]
      properties:
        bucket: { type: string, format: date-time }
        model: { type: string }
        tier: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        reasoning_tokens: { type: integer, format: int64 }
        upstream_cost_micro: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
    UsageSummary:
      type: object
      required: [granularity, items]
      properties:
        granularity: { type: string, enum: [hour, day] }
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageBucket' }
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: string }

    AdminUser:
      type: object
      required: [id, username, role, status, balance_micro, max_concurrency, note, created_at, updated_at, safeguard_locked]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        safeguard_locked: { type: boolean, description: Every key is refused until the count drops below the allowance. }
        balance_micro: { type: integer, format: int64 }
        max_concurrency: { type: integer }
        rpm: { type: integer, nullable: true }
        note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        next_cursor: { type: string, nullable: true }
    AdminUserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.@-]+$' }
        password: { type: string, minLength: 8, maxLength: 256 }
        role: { $ref: '#/components/schemas/Role' }
        max_concurrency: { type: integer, minimum: 0, description: Defaults to settings.default_user_concurrency. }
        rpm: { type: integer, minimum: 0, nullable: true }
        note: { type: string }
    AdminUserUpdate:
      type: object
      description: Fields left out keep their value; send rpm null for unlimited.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        max_concurrency: { type: integer, minimum: 0 }
        rpm: { type: integer, minimum: 0, nullable: true }
        note: { type: string }
        password: { type: string, minLength: 8, maxLength: 256 }
    BalanceAdjust:
      type: object
      required: [type, amount_micro, note]
      properties:
        type: { type: string, enum: [topup, adjust] }
        amount_micro: { type: integer, format: int64, description: Must be positive for topup; signed for adjust. }
        note: { type: string, minLength: 1 }
        idempotency_key: { type: string, maxLength: 128, description: Optional client key; a repeat returns 409. }

    QuotaWindow:
      type: object
      required: [used_percent, total_usd, remaining_usd]
      properties:
        used_percent: { type: number, format: double }
        reset_at: { type: string, format: date-time, nullable: true }
        total_usd: { type: number, format: double }
        remaining_usd: { type: number, format: double, description: Already multiplied by the safety factor; local reset applied. }
    AccountRuntime:
      type: object
      required: [status, display_status, status_reason, status_reason_code, hard_reason, penalized, stale, hard_exhausted, oversold, assignable, headroom_micro, reserved_micro, spend_since_observed_micro, current_concurrency, models]
      properties:
        assignable:
          type: boolean
          description: |
            Decided by the backend: the account can take a new session of a normal call right now —
            enabled, not stale / cooldown / error / 5h or week full, and H_A above the
            normal-call threshold (standard_min_headroom_micro). A penalized account with enough
            headroom is assignable.
        status:
          type: string
          enum: [normal, stale, cooldown, error, disabled]
        display_status:
          $ref: '#/components/schemas/AccountDisplayStatus'
        status_reason:
          type: string
          description: |
            Raw detail behind `status_reason_code` (upstream error text, cooldown reason, last
            /quota error); may be empty. Not translated: show it only as a detail.
        status_reason_code:
          type: string
          description: |
            Machine-readable reason for `display_status` (empty when there is none). Known codes:
            `disabled`, `upstream_auth` (upstream 401 / 403), `error`
            (any other error), `network`, `upstream_429`, `upstream_5xx`, `error_cooldown`,
            `cooldown`, `quota_stale`, `5h_exhausted`, `week_exhausted`, `penalized`.
            Clients must cope with codes they do not know.
        hard_reason:
          type: string
          description: Why the account cannot take requests (`5h_exhausted`, `week_exhausted`, `cooldown`), empty otherwise.
        oversold:
          type: boolean
          description: H_A < 0 (plan reservations exceed what is left of the week).
        penalized:
          type: boolean
          description: 5-hour usage is at or above the effective watermark, so routing weight is multiplied by the penalty (shown as "降权中" while the status is normal).
        stale: { type: boolean }
        cooldown_until: { type: string, format: date-time, nullable: true }
        hard_exhausted: { type: boolean }
        state: { type: string, description: 'cpa-quota account state: cold or estimated.' }
        safety_factor: { type: number, format: double }
        observed_at: { type: string, format: date-time, nullable: true }
        fetched_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        database_status: { type: string }
        estimates_loaded: { type: boolean }
        five_hour:
          allOf:
            - $ref: '#/components/schemas/QuotaWindow'
          nullable: true
        week:
          allOf:
            - $ref: '#/components/schemas/QuotaWindow'
          nullable: true
        headroom_micro: { type: integer, format: int64, description: 'H_A = (week.remaining − S_A) − Σ reservations.' }
        reserved_micro: { type: integer, format: int64 }
        spend_since_observed_micro: { type: integer, format: int64, description: S_A. }
        weight: { type: number, format: double }
        current_concurrency: { type: integer, format: int64 }
        models:
          type: array
          items: { type: string }
    AccountDisplayStatus:
      type: string
      description: |
        The single status to show for an account, by priority: error > disabled > cooldown >
        five_hour_full / week_full (hard exhausted) > stale > penalized > normal.
      enum: [error, disabled, cooldown, five_hour_full, week_full, stale, penalized, normal]
    Account:
      type: object
      required: [id, name, base_url, enabled, note, instance, tier, auth_index, watermark_5h_percent_effective, created_at, updated_at, runtime, sold_weekly_quota_micro, sold_upstream_micro]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string }
        enabled: { type: boolean }
        watermark_5h_percent: { type: number, format: double, nullable: true }
        watermark_5h_percent_effective: { type: number, format: double }
        max_concurrency: { type: integer, nullable: true }
        note: { type: string }
        instance: { type: string }
        tier: { type: string }
        auth_index: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        runtime: { $ref: '#/components/schemas/AccountRuntime' }
        sold_weekly_quota_micro:
          type: integer
          format: int64
          description: Σ weekly quota (user price) of the active and pending_assignment subscriptions bound to the account.
        sold_upstream_micro:
          type: integer
          format: int64
          description: sold_weekly_quota_micro ÷ plan multiplier, comparable with week_total_micro (the overcommit warning uses the same figures).
        week_total_micro:
          type: integer
          format: int64
          nullable: true
          description: The account's reported week total (week.total_usd, before the safety factor); null when unknown.
        k:
          type: number
          format: double
          nullable: true
          description: |
            k = week total ÷ 5-hour total. Taken from the account's /quota response (accounts[0].k);
            when the response has none, from the cpa-quota estimate's k. Null when neither is known.
    AccountList:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        summary: { $ref: '#/components/schemas/OverviewAccounts' }
    AccountCreate:
      type: object
      required: [name, base_url, cpa_key, quota_token]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        base_url: { type: string, minLength: 1 }
        cpa_key: { type: string, minLength: 1 }
        quota_token: { type: string, minLength: 1 }
        enabled: { type: boolean, default: true }
        watermark_5h_percent: { type: number, format: double, minimum: 0, maximum: 100, nullable: true }
        max_concurrency: { type: integer, minimum: 0, nullable: true }
        note: { type: string }
    AccountUpdate:
      type: object
      description: Fields left out keep their value (secrets are never returned; omit them to keep them).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        base_url: { type: string, minLength: 1 }
        cpa_key: { type: string, minLength: 1 }
        quota_token: { type: string, minLength: 1 }
        enabled: { type: boolean }
        watermark_5h_percent: { type: number, format: double, minimum: 0, maximum: 100, nullable: true }
        max_concurrency: { type: integer, minimum: 0, nullable: true }
        note: { type: string }
    AccountValidateRequest:
      type: object
      required: [base_url, cpa_key, quota_token]
      properties:
        base_url: { type: string, minLength: 1 }
        cpa_key: { type: string, minLength: 1 }
        quota_token: { type: string, minLength: 1 }
    EnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AccountTestResult:
      type: object
      required: [ok, quota_ok, models_ok]
      properties:
        ok: { type: boolean }
        quota_ok: { type: boolean }
        quota_error: { type: string }
        models_ok: { type: boolean }
        models_error: { type: string }
        instance: { type: string }
        tier: { type: string }
        auth_index: { type: string }
        models:
          type: array
          items: { type: string }

    BlockingSubscription:
      type: object
      required: [id, user_id, username, status, plan_name]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        plan_name: { type: string }
    CpaQuotaEstimate:
      type: object
      description: A row of cpa-quota's `estimates` table (schema version 1, cpa-quota v0.1.0), unchanged.
      required: [instance, auth_index, tier, state, basis, k_source,
                 totals_from, safety_factor, used_5h, used_7d, five_hour_total_usd, weekly_total_usd, remaining_five_hour_usd,
                 remaining_week_usd, clean_blocks, total_blocks, segments, excluded_segments, ratio, estimated_at, detail]
      properties:
        instance: { type: string }
        auth_index: { type: string }
        tier: { type: string }
        state: { type: string }
        basis: { type: string }
        k: { type: number, format: double, nullable: true }
        k_source: { type: string }
        totals_from: { type: string }
        safety_factor: { type: number, format: double }
        used_5h: { type: number, format: double }
        reset_5h: { type: string, format: date-time, nullable: true }
        used_7d: { type: number, format: double }
        reset_7d: { type: string, format: date-time, nullable: true }
        five_hour_total_usd: { type: number, format: double }
        weekly_total_usd: { type: number, format: double }
        remaining_five_hour_usd: { type: number, format: double }
        remaining_week_usd: { type: number, format: double }
        clean_blocks: { type: integer }
        total_blocks: { type: integer }
        segments: { type: integer }
        excluded_segments: { type: integer }
        ratio: { type: number, format: double }
        observed_at: { type: string, format: date-time, nullable: true }
        estimated_at: { type: string, format: date-time }
        detail:
          type: object
          description: The full quota-endpoint account object as cpa-quota stored it.
          x-go-type: json.RawMessage
    KTrendDay:
      type: object
      required: [day, gain_5h, gain_7d, segments, excluded_segments, cost_usd, gain, updated_at]
      properties:
        day: { type: string, format: date }
        gain_5h: { type: number, format: double }
        gain_7d: { type: number, format: double }
        k: { type: number, format: double, nullable: true }
        segments: { type: integer }
        excluded_segments: { type: integer }
        cost_usd: { type: number, format: double }
        gain: { type: number, format: double }
        updated_at: { type: string, format: date-time }
    KTrend:
      type: object
      required: [days, items]
      properties:
        days: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/KTrendDay' }
    QuotaPoint:
      type: object
      required: [at, used_percent]
      properties:
        at: { type: string, format: date-time }
        used_percent: { type: number, format: double }
        reset_at: { type: string, format: date-time, nullable: true }
    QuotaSeries:
      type: object
      required: [window, from, to, downsampled, total_points, items]
      properties:
        window: { type: string, enum: [5h, 7d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        downsampled: { type: boolean }
        bucket_seconds: { type: integer, format: int64, nullable: true, description: Bucket width when downsampled. }
        total_points: { type: integer, format: int64, description: Points in the range before downsampling. }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotaPoint' }
    CostCompareRow:
      type: object
      required: [bucket, cpa_quota_cost_micro, cpa_quota_requests, bridge_upstream_cost_micro, bridge_requests, diff_micro]
      properties:
        bucket: { type: string, format: date-time }
        cpa_quota_cost_micro: { type: integer, format: int64, description: Σ cost_usd of complete-accounting requests, in micro-USD. }
        cpa_quota_requests: { type: integer, format: int64, description: Number of complete-accounting requests. }
        bridge_upstream_cost_micro: { type: integer, format: int64 }
        bridge_requests: { type: integer, format: int64 }
        diff_micro: { type: integer, format: int64, description: cpa_quota_cost_micro − bridge_upstream_cost_micro. }
    CostCompare:
      type: object
      required: [bucket, from, to, items, cpa_quota_total_micro, bridge_total_micro, diff_micro]
      properties:
        bucket: { type: string, enum: [hour, day] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        cpa_quota_total_micro: { type: integer, format: int64 }
        bridge_total_micro: { type: integer, format: int64 }
        diff_micro: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/CostCompareRow' }
    AvailabilityHorizon:
      type: object
      required: [horizon, pool_micro, available_micro, limited_by_balance]
      properties:
        horizon: { type: string, enum: [1h, 5h, 24h, 7d] }
        pool_micro:
          type: integer
          format: int64
          description: Estimated pool capacity over the horizon, at the user price (× tier multiplier).
        available_micro:
          type: integer
          format: int64
          description: min(pool_micro, balance_available_micro), never below 0.
        limited_by_balance: { type: boolean, description: True when the balance is smaller than the pool. }
    PlanWindowAvailability:
      type: object
      required: [available_micro]
      properties:
        available_micro: { type: integer, format: int64 }
        reset_at: { type: string, format: date-time, nullable: true, description: 'five_hour: next 5-hour reset (null without a 5-hour window).' }
        ends_at: { type: string, format: date-time, nullable: true, description: 'period: end of the current plan period.' }
    PlanAvailability:
      type: object
      required: [subscription_id, plan_name, status]
      properties:
        subscription_id: { type: string, format: uuid }
        plan_name: { type: string }
        status: { type: string, enum: [active, pending_assignment] }
        account_status:
          type: string
          nullable: true
          enum: [normal, stale, cooldown, unavailable, null]
          description: |
            State of the bound upstream account only (no account details). Null while
            pending. A disabled account or one in error is `unavailable`, and then both
            `five_hour.available_micro` and `period.available_micro` are 0.
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
        quota_micro: { type: integer, format: int64, nullable: true }
        used_micro: { type: integer, format: int64, nullable: true, description: Billed usage of the period. }
        remaining_micro: { type: integer, format: int64, nullable: true, description: Real-time remaining of the period (billed). }
        five_hour:
          allOf:
            - $ref: '#/components/schemas/PlanWindowAvailability'
          nullable: true
          description: min(remaining, r5 × plan multiplier).
        period:
          allOf:
            - $ref: '#/components/schemas/PlanWindowAvailability'
          nullable: true
          description: min(remaining, min(C5, C7) until the period end × plan multiplier).
    Availability:
      type: object
      required: [computed_at, estimated, balance_available_micro, normal, force, plans]
      properties:
        computed_at: { type: string, format: date-time, description: When the cached pool figures were computed. }
        estimated: { type: boolean, description: Always true. }
        balance_available_micro: { type: integer, format: int64, description: Real-time available balance (may be negative). }
        normal:
          type: array
          description: Normal calls (standard tier), per horizon.
          items: { $ref: '#/components/schemas/AvailabilityHorizon' }
        force:
          type: array
          description: Forced calls (force tier), per horizon.
          items: { $ref: '#/components/schemas/AvailabilityHorizon' }
        plans:
          type: array
          description: One item per active or pending subscription of the caller.
          items: { $ref: '#/components/schemas/PlanAvailability' }
    TierMultipliers:
      type: object
      required: [plan, standard, force]
      properties:
        plan: { type: number, format: double, minimum: 0 }
        standard: { type: number, format: double, minimum: 0 }
        force: { type: number, format: double, minimum: 0 }
    Settings:
      type: object
      required: [default_user_concurrency, watermark_5h_percent, watermark_penalty, standard_min_headroom_micro, sticky_ttl_seconds, sticky_ttl_1h_seconds, tier_multipliers, model_multipliers, hold_cap_micro, hold_default_max_tokens, max_retries, quota_poll_seconds, stale_after_seconds, models_poll_minutes, price_url, price_refresh_hours, upstream_idle_timeout_seconds, auto_renew_lead_hours, cooldown_5xx_seconds, cooldown_429_default_seconds, public_query_ip_per_minute, public_query_key_per_minute, status_key_per_minute, admin_token_per_minute, stream_backlog_threshold, vapid_subject, vapid_subject_effective, relay_error_locale, safeguard_default_allowance, safeguard_default_reset_cards, safeguard_hash_min_chars]
      properties:
        default_user_concurrency: { type: integer }
        watermark_5h_percent: { type: number, format: double }
        watermark_penalty: { type: number, format: double }
        standard_min_headroom_micro: { type: integer, format: int64 }
        sticky_ttl_seconds: { type: integer }
        sticky_ttl_1h_seconds: { type: integer }
        tier_multipliers: { $ref: '#/components/schemas/TierMultipliers' }
        model_multipliers:
          type: object
          description: Normalized model name -> multiplier (default 1).
          additionalProperties: { type: number, format: double }
        hold_cap_micro: { type: integer, format: int64 }
        hold_default_max_tokens: { type: integer, format: int64 }
        max_retries: { type: integer }
        quota_poll_seconds: { type: integer }
        stale_after_seconds: { type: integer }
        models_poll_minutes: { type: integer }
        price_url: { type: string }
        price_refresh_hours: { type: integer }
        upstream_idle_timeout_seconds: { type: integer }
        auto_renew_lead_hours: { type: integer }
        cooldown_5xx_seconds: { type: integer }
        cooldown_429_default_seconds: { type: integer }
        public_query_ip_per_minute: { type: integer, minimum: 1, maximum: 10000, description: GET /public/key-usage per client IP per minute (default 30). }
        public_query_key_per_minute: { type: integer, minimum: 1, maximum: 10000, description: GET /public/key-usage per key per minute (default 30). }
        status_key_per_minute: { type: integer, minimum: 1, maximum: 10000, description: GET /v1/bridge/status (relay domain) per key per minute (default 60). }
        admin_token_per_minute: { type: integer, minimum: 1, maximum: 10000, description: Requests per admin API token per minute (default 120). }
        stream_backlog_threshold: { type: integer, minimum: 1, description: 'Settlement stream backlog (entries) that, held for 5 minutes, sends stream_backlog_high (default 1000).' }
        vapid_subject: { type: string, description: 'Web Push contact (mailto: or https:); empty = BRIDGE_VAPID_SUBJECT or a placeholder.' }
        vapid_subject_effective: { type: string, readOnly: true, description: The contact actually used. }
        relay_error_locale: { type: string, enum: [zh-CN, en], description: 'Language of error.message in relay (/v1) answers (default zh-CN); error.code and error.type are never localized.' }
        safeguard_default_allowance: { type: integer, minimum: 1, maximum: 1000, description: Safeguard triggers per user before every key is locked (default 3; a user override wins). Changes apply to every user at once. }
        safeguard_default_reset_cards: { type: integer, minimum: 0, maximum: 1000, description: Reset cards a new user starts with (default 1). }
        safeguard_hash_min_chars: { type: integer, minimum: 0, maximum: 10000, description: Shortest normalized prompt (characters) put on the blocklist (default 16). }
    SettingsPatch:
      type: object
      description: Any subset of Settings.
      properties:
        default_user_concurrency: { type: integer }
        watermark_5h_percent: { type: number, format: double }
        watermark_penalty: { type: number, format: double }
        standard_min_headroom_micro: { type: integer, format: int64 }
        sticky_ttl_seconds: { type: integer }
        sticky_ttl_1h_seconds: { type: integer }
        tier_multipliers: { $ref: '#/components/schemas/TierMultipliers' }
        model_multipliers:
          type: object
          additionalProperties: { type: number, format: double }
        hold_cap_micro: { type: integer, format: int64 }
        hold_default_max_tokens: { type: integer, format: int64 }
        max_retries: { type: integer }
        quota_poll_seconds: { type: integer }
        stale_after_seconds: { type: integer }
        models_poll_minutes: { type: integer }
        price_url: { type: string }
        price_refresh_hours: { type: integer }
        upstream_idle_timeout_seconds: { type: integer }
        auto_renew_lead_hours: { type: integer }
        cooldown_5xx_seconds: { type: integer }
        cooldown_429_default_seconds: { type: integer }
        public_query_ip_per_minute: { type: integer, minimum: 1, maximum: 10000 }
        public_query_key_per_minute: { type: integer, minimum: 1, maximum: 10000 }
        status_key_per_minute: { type: integer, minimum: 1, maximum: 10000 }
        admin_token_per_minute: { type: integer, minimum: 1, maximum: 10000 }
        stream_backlog_threshold: { type: integer, minimum: 1 }
        vapid_subject: { type: string }
        relay_error_locale: { type: string, enum: [zh-CN, en] }
        safeguard_default_allowance: { type: integer, minimum: 1, maximum: 1000 }
        safeguard_default_reset_cards: { type: integer, minimum: 0, maximum: 1000 }
        safeguard_hash_min_chars: { type: integer, minimum: 0, maximum: 10000 }

    AuditLog:
      type: object
      required: [id, action, target_type, target_id, diff, ip, created_at]
      properties:
        id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        diff:
          type: object
          description: '{"before": ..., "after": ...} with secrets removed.'
          additionalProperties: true
        ip: { type: string }
        token_id: { type: string, format: uuid, nullable: true, description: Set when the write was made with an admin API token (operator_id is its creator). }
        token_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AdminTokenScope:
      type: string
      description: read = GET / HEAD admin endpoints (SSE included); write = every admin operation except managing tokens, roles and admin passwords.
      enum: [read, write]
    AdminToken:
      type: object
      required: [id, name, prefix, scope, status, created_by, created_by_username, expires_at, ip_allowlist, last_used_at, last_used_ip, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Display form (start and end of the token). }
        scope: { $ref: '#/components/schemas/AdminTokenScope' }
        status: { type: string, enum: [active, expired, revoked] }
        created_by: { type: string, format: uuid }
        created_by_username: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        ip_allowlist:
          type: array
          nullable: true
          items: { type: string }
          description: CIDR prefixes; null = any address.
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip: { type: string }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AdminTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminToken' }
    AdminTokenCreate:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope: { $ref: '#/components/schemas/AdminTokenScope' }
        expires_at: { type: string, format: date-time, nullable: true, description: Must be in the future; null = never. }
        ip_allowlist:
          type: array
          nullable: true
          maxItems: 64
          items: { type: string }
          description: IP addresses or CIDR prefixes; empty or null = any address.
    AdminTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/AdminToken' }
        secret: { type: string, description: 'The full token (oba-…). Shown only once.' }

    PushConfig:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, description: VAPID public key (base64url, uncompressed P-256 point). }
    PushSubscriptionCreate:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 256 }
            auth: { type: string, minLength: 1, maxLength: 256 }
    PushDevice:
      type: object
      required: [id, endpoint, device_label, created_at, last_success_at, failures]
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string, description: Lets the browser recognize its own entry. }
        device_label: { type: string, description: 'Guessed from the User-Agent at registration, e.g. "iPhone · Safari".' }
        created_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time, nullable: true }
        failures: { type: integer }
    PushDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PushDevice' }
    PushTestResult:
      type: object
      required: [devices]
      properties:
        devices: { type: integer }
    NotificationEvent:
      type: string
      description: |
        Admin events: account_auth_error, account_stale, subscription_pending,
        reconcile_mismatch, stream_backlog_high (on by default), account_full,
        safeguard_event (off by default), safeguard_appeal_new (on). User
        events: balance_low, plan_expiring, auto_renew_failed,
        safeguard_appeal_result (on by default), key_exhausted (off).
      enum: [account_auth_error, account_stale, subscription_pending, reconcile_mismatch, stream_backlog_high, account_full, safeguard_event, safeguard_appeal_new, balance_low, plan_expiring, auto_renew_failed, key_exhausted, safeguard_appeal_result]
    NotificationPref:
      type: object
      required: [event, group, enabled, default_enabled]
      properties:
        event: { $ref: '#/components/schemas/NotificationEvent' }
        group: { type: string, enum: [admin, user] }
        enabled: { type: boolean }
        default_enabled: { type: boolean }
    NotificationPrefs:
      type: object
      required: [items, balance_threshold_micro]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationPref' }
        balance_threshold_micro: { type: integer, format: int64, description: balance_low fires when the balance falls below this (default $5). }
    NotificationPrefsUpdate:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            required: [event, enabled]
            properties:
              event: { $ref: '#/components/schemas/NotificationEvent' }
              enabled: { type: boolean }
        balance_threshold_micro: { type: integer, format: int64, minimum: 0 }
    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        next_cursor: { type: string, nullable: true }
    SafeguardEvent:
      type: object
      description: |
        One request Claude refused for safety reasons. `counted` is false
        when the prompt was already on the blocklist (a concurrent repeat),
        so it did not use the user's allowance. `prompt` is the normalized
        last user message (see README); the list cuts it to 500 characters.
      required: [id, request_id, model, category, reason, created_at, status_code, stream, counted, prompt_hash, prompt, has_body, body_size, username, key_name, key_prefix, account_name]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        key_id: { type: string, format: uuid, nullable: true }
        account_id: { type: string, format: uuid, nullable: true }
        model: { type: string }
        category: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        status_code: { type: integer, description: Upstream status (200 for a refusal inside a response or stream). }
        stream: { type: boolean }
        counted: { type: boolean }
        prompt_hash: { type: string, description: Empty when the prompt was too short to hash. }
        prompt: { type: string }
        has_body: { type: boolean }
        body_size: { type: integer, format: int64, description: Uncompressed body size in bytes. }
        username: { type: string }
        key_name: { type: string }
        key_prefix: { type: string }
        account_name: { type: string }
    SafeguardEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SafeguardEvent' }
        next_cursor: { type: string, nullable: true }
    SafeguardBodyChunk:
      type: object
      required: [text, offset, total_size]
      properties:
        text: { type: string }
        offset: { type: integer, format: int64 }
        next_offset: { type: integer, format: int64, nullable: true }
        total_size: { type: integer, format: int64 }
    SafeguardBlock:
      type: object
      required: [hash, prompt, created_at, hits, first_username, revoked_by_username]
      properties:
        hash: { type: string }
        prompt: { type: string }
        first_event_id: { type: string, format: uuid, nullable: true }
        first_user_id: { type: string, format: uuid, nullable: true }
        first_username: { type: string }
        created_at: { type: string, format: date-time }
        hits: { type: integer, format: int64, description: Requests the entry stopped. }
        last_hit_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by_username: { type: string }
    SafeguardBlockPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SafeguardBlock' }
        next_cursor: { type: string, nullable: true }
    SafeguardAppealStatus:
      type: string
      enum: [pending, approved, rejected]
    SafeguardAppeal:
      type: object
      required: [id, user_id, username, note, status, reject_reason, created_at, decided_by_username, used, allowance, reset_cards]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        note: { type: string }
        status: { $ref: '#/components/schemas/SafeguardAppealStatus' }
        reject_reason: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by_username: { type: string }
        used: { type: integer, description: The user's current count. }
        allowance: { type: integer, description: The user's allowance in effect. }
        reset_cards: { type: integer }
    SafeguardAppealPage:
      type: object
      required: [items, pending]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SafeguardAppeal' }
        next_cursor: { type: string, nullable: true }
        pending: { type: integer, format: int64 }
    SafeguardAppealCreate:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
    SafeguardAppealReject:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    MySafeguardAppeal:
      type: object
      required: [id, note, status, reject_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        note: { type: string }
        status: { $ref: '#/components/schemas/SafeguardAppealStatus' }
        reject_reason: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
    MySafeguardEvent:
      type: object
      required: [created_at, model, category, counted]
      properties:
        created_at: { type: string, format: date-time }
        model: { type: string }
        category: { type: string }
        counted: { type: boolean }
    MySafeguardBlocked:
      type: object
      required: [created_at, key_name, key_prefix]
      properties:
        created_at: { type: string, format: date-time }
        key_name: { type: string }
        key_prefix: { type: string }
    MySafeguard:
      type: object
      description: |
        Safeguard state of the caller. While `locked`, every key of the user
        is refused locally with `safeguard_locked`. Requests whose prompt is
        on the site-wide blocklist are refused with `safeguard_prompt_blocked`,
        never reach upstream and do not use the allowance; `blocked_count`
        and `recent_blocked` list them. Administrators can view the requests
        that triggered the safeguard.
      required: [allowance, used, remaining, reset_cards, locked, events_count, recent_events, blocked_count, recent_blocked]
      properties:
        allowance: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        reset_cards: { type: integer }
        locked: { type: boolean }
        locked_at: { type: string, format: date-time, nullable: true }
        appeal:
          allOf: [{ $ref: '#/components/schemas/MySafeguardAppeal' }]
          nullable: true
          description: The latest appeal, if any.
        events_count: { type: integer, format: int64 }
        recent_events:
          type: array
          description: The latest 20 triggers.
          items: { $ref: '#/components/schemas/MySafeguardEvent' }
        blocked_count: { type: integer, format: int64 }
        recent_blocked:
          type: array
          description: The latest 20 requests stopped by the blocklist.
          items: { $ref: '#/components/schemas/MySafeguardBlocked' }
    AdminUserSafeguard:
      type: object
      required: [user_id, username, allowance, default_allowance, used, reset_cards, locked, events_count, blocked_count]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        allowance: { type: integer, description: Allowance in effect. }
        allowance_override: { type: integer, nullable: true, description: null = the default setting. }
        default_allowance: { type: integer }
        used: { type: integer }
        reset_cards: { type: integer }
        locked: { type: boolean }
        locked_at: { type: string, format: date-time, nullable: true }
        events_count: { type: integer, format: int64 }
        blocked_count: { type: integer, format: int64 }
    AdminUserSafeguardUpdate:
      type: object
      description: Fields left out keep their value; allowance_override null = use the default.
      properties:
        allowance_override: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        used: { type: integer, minimum: 0, maximum: 100000 }
        reset_cards: { type: integer, minimum: 0, maximum: 1000 }
    PriceStatus:
      type: object
      required: [source_url, origin, models, last_error]
      properties:
        source_url: { type: string }
        origin: { type: string, enum: [remote, database, none] }
        models: { type: integer }
        fetched_at: { type: string, format: date-time, nullable: true }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
    ReconcileResult:
      type: object
      required: [ok, balance_mismatches, billed_total_micro, api_charge_total_micro]
      properties:
        ok: { type: boolean }
        balance_mismatches:
          type: array
          items:
            type: object
            required: [user_id, balance_micro, ledger_total_micro]
            properties:
              user_id: { type: string, format: uuid }
              balance_micro: { type: integer, format: int64 }
              ledger_total_micro: { type: integer, format: int64 }
        billed_total_micro: { type: integer, format: int64 }
        api_charge_total_micro: { type: integer, format: int64 }

    OverviewTierTotals:
      type: object
      required: [tier, requests, billed_micro, upstream_cost_micro]
      properties:
        tier: { type: string, description: 'plan, standard, force, or empty (rejected before a tier admitted it).' }
        requests: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
        upstream_cost_micro: { type: integer, format: int64 }
    OverviewToday:
      type: object
      required: [day, from, to, requests, billed_micro, upstream_cost_micro, by_tier]
      properties:
        day: { type: string, format: date, description: The day in the server time zone. }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        requests: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
        upstream_cost_micro: { type: integer, format: int64 }
        by_tier:
          type: array
          description: One row per tier that has requests today, in the order plan, standard, force, other.
          items: { $ref: '#/components/schemas/OverviewTierTotals' }
    OverviewAccounts:
      type: object
      description: Accounts counted by `display_status` (each account in exactly one bucket) and the pooled figures.
      required: [total, normal, penalized, full, stale, cooldown, error, disabled, assignable, headroom_micro, reserved_micro, oversold_count, oversold_micro]
      properties:
        total: { type: integer }
        assignable: { type: integer, description: Accounts with runtime.assignable (overlaps the display buckets). }
        normal: { type: integer, description: Normal and not penalized. }
        penalized: { type: integer, description: Normal status with the routing weight reduced (降权中). }
        full: { type: integer, description: 'Hard exhausted: 5-hour or week window full.' }
        stale: { type: integer }
        cooldown: { type: integer }
        error: { type: integer }
        disabled: { type: integer }
        headroom_micro:
          type: integer
          format: int64
          description: Σ max(0, H_A) over enabled accounts that are not in error. A negative H_A (oversold) never offsets other accounts.
        reserved_micro: { type: integer, format: int64, description: Σ plan reservations over all accounts. }
        oversold_count: { type: integer, description: Accounts of the headroom set with H_A < 0. }
        oversold_micro: { type: integer, format: int64, description: Σ −H_A over those accounts (how far reservations exceed what is left). }
    ReconcileRun:
      type: object
      required: [id, started_at, finished_at, ok, balance_mismatches, charge_diff_micro]
      properties:
        id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        ok: { type: boolean }
        balance_mismatches: { type: integer }
        charge_diff_micro: { type: integer, format: int64 }
    AdminOverview:
      type: object
      required: [generated_at, timezone, today, accounts, pending_assignment, stream_backlog, last_reconcile]
      properties:
        generated_at: { type: string, format: date-time }
        timezone: { type: string, description: IANA name of the server time zone used to cut days. }
        today: { $ref: '#/components/schemas/OverviewToday' }
        accounts: { $ref: '#/components/schemas/OverviewAccounts' }
        pending_assignment: { type: integer, format: int64, description: Subscriptions waiting for an account (also the navigation badge). }
        stream_backlog:
          type: integer
          format: int64
          description: Settlement stream entries not yet acknowledged by the consumer group (lag + pending; the stream length while the group does not exist yet).
        last_reconcile:
          allOf:
            - $ref: '#/components/schemas/ReconcileRun'
          nullable: true

    AccountStatusEvent:
      type: object
      description: Data of the `account_status` SSE event, sent after every quota poll of an account.
      required: [account_id, name, fetched_at, last_error, stale]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string }
        fetched_at: { type: string, format: date-time }
        last_error: { type: string }
        stale: { type: boolean }
        snapshot:
          type: object
          description: The raw quota snapshot (internal shape; refetch the account for the computed view).
          additionalProperties: true
    RequestSettledEvent:
      type: object
      description: Data of the `request_settled` SSE event.
      required: [request_id, created_at, user_id, tier, model, status_code, upstream_cost_micro, billed_micro, latency_ms]
      properties:
        request_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        tier: { type: string }
        model: { type: string }
        status_code: { type: integer }
        upstream_cost_micro: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
        latency_ms: { type: integer }

    KeyWindowStatus:
      type: object
      required: [window, used_micro]
      properties:
        window: { type: string, enum: [5h, 1d, 7d] }
        limit_micro: { type: integer, format: int64, nullable: true }
        used_micro: { type: integer, format: int64, description: Billed in the sliding window under the key's scope (settled; in-flight holds are in held_micro). }
        held_micro: { type: integer, format: int64 }
        remaining_micro: { type: integer, format: int64, nullable: true, description: limit − used − held (may be negative); null without a limit. }
        recovers_at: { type: string, format: date-time, nullable: true, description: When an exhausted window is expected to allow requests again. }
    KeyLimitStatus:
      type: object
      required: [quota_scope, quota_used_micro, quota_held_micro, used_all_micro, used_balance_micro, windows]
      properties:
        quota_scope: { $ref: '#/components/schemas/QuotaScope' }
        quota_limit_micro: { type: integer, format: int64, nullable: true }
        quota_used_micro: { type: integer, format: int64, description: Used since the last reset under the key's scope (real time). }
        quota_held_micro: { type: integer, format: int64 }
        quota_remaining_micro: { type: integer, format: int64, nullable: true }
        used_all_micro: { type: integer, format: int64 }
        used_balance_micro: { type: integer, format: int64 }
        usage_reset_at: { type: string, format: date-time, nullable: true }
        windows:
          type: array
          items: { $ref: '#/components/schemas/KeyWindowStatus' }
        exhausted: { $ref: '#/components/schemas/KeyExhaustion' }
    KeyExhaustion:
      type: object
      description: |
        Present when the total quota or a window of the key is used up (the
        quota is reported before the windows). With `quota_scope = all` the
        whole key is refused; with `balance` only the standard and force tiers
        are, and `plan_available` is true.
      required: [code, plan_available, message]
      properties:
        code: { type: string, enum: [key_quota_exhausted, key_window_exhausted, key_balance_quota_exhausted] }
        window: { type: string, enum: [5h, 1d, 7d] }
        recovers_at: { type: string, format: date-time, nullable: true }
        plan_available: { type: boolean, description: True when requests on the plan tier are still allowed (balance scope). }
        message: { type: string }
    KeyStatusKey:
      type: object
      required: [name, prefix, status, quota_scope]
      properties:
        name: { type: string }
        prefix: { type: string }
        status: { $ref: '#/components/schemas/KeyStatusValue' }
        expires_at: { type: string, format: date-time, nullable: true }
        quota_scope: { $ref: '#/components/schemas/QuotaScope' }
        model_allowlist:
          type: array
          nullable: true
          items: { type: string }
    OwnerPlanSummary:
      type: object
      required: [subscription_id, plan_name, status]
      properties:
        subscription_id: { type: string, format: uuid }
        plan_name: { type: string }
        status: { type: string, enum: [active, pending_assignment] }
        five_hour_available_micro: { type: integer, format: int64, nullable: true }
        period_available_micro: { type: integer, format: int64, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
    OwnerSummary:
      type: object
      description: Only present when the key allows owner queries (same figures as /me/availability).
      required: [balance_available_micro, plans, normal, force]
      properties:
        balance_available_micro: { type: integer, format: int64 }
        plans:
          type: array
          items: { $ref: '#/components/schemas/OwnerPlanSummary' }
        normal:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityHorizon' }
        force:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityHorizon' }
    KeyStatus:
      type: object
      description: Compact key status (also the body of GET /v1/bridge/status on the relay domain).
      required: [key, limits, generated_at]
      properties:
        generated_at: { type: string, format: date-time }
        key: { $ref: '#/components/schemas/KeyStatusKey' }
        limits: { $ref: '#/components/schemas/KeyLimitStatus' }
        account: { $ref: '#/components/schemas/OwnerSummary' }
    PublicKeyUsage:
      allOf:
        - $ref: '#/components/schemas/KeyStatus'
        - type: object
          required: [recent]
          properties:
            recent:
              type: array
              description: The key's latest 50 requests (user view).
              items: { $ref: '#/components/schemas/MyRequestLog' }
    KeyDailyRow:
      type: object
      required: [day, tier, requests, errors, input_tokens, cache_read_tokens, cache_write_tokens, output_tokens, reasoning_tokens, billed_micro]
      properties:
        day: { type: string, format: date }
        tier: { type: string }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        reasoning_tokens: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
    KeyDailyUsage:
      type: object
      required: [key_id, days, timezone, items]
      properties:
        key_id: { type: string, format: uuid }
        days: { type: integer }
        timezone: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/KeyDailyRow' }
    KeyUsageTotal:
      type: object
      required: [key_id, name, prefix, deleted, requests, errors, input_tokens, cache_read_tokens, cache_write_tokens, output_tokens, reasoning_tokens, billed_micro]
      properties:
        key_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        deleted: { type: boolean }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        reasoning_tokens: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
    KeyDailyPoint:
      type: object
      required: [day, requests, billed_micro]
      properties:
        day: { type: string, format: date }
        requests: { type: integer, format: int64 }
        billed_micro: { type: integer, format: int64 }
    KeySeries:
      type: object
      required: [key_id, points]
      properties:
        key_id: { type: string, format: uuid }
        points:
          type: array
          items: { $ref: '#/components/schemas/KeyDailyPoint' }
    KeyUsageComparison:
      type: object
      required: [from, to, timezone, items, top]
      properties:
