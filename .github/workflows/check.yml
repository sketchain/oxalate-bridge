name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out instead of the triggering one.
        type: string
        default: ""
      expect_tag:
        description: When set, the code Version must equal this tag without its leading v.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  SQLC_VERSION: v1.31.1
  OAPI_CODEGEN_VERSION: v2.8.2
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Format, vet and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Code version matches the tag
        if: inputs.expect_tag != ''
        env:
          EXPECT_TAG: ${{ inputs.expect_tag }}
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
          test "v$version" = "$EXPECT_TAG"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run ./...

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: sqlc
        working-directory: backend
        run: go run "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}" generate

      - name: oapi-codegen
        working-directory: backend
        run: go run "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}" -config oapi-codegen.yaml ../api/openapi.yaml

      - name: TypeScript API types (openapi-typescript)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api

      - name: Route tree (TanStack Router)
        working-directory: web
        run: pnpm build

      - name: No diff
        run: |
          # The frontend build output (backend/internal/webui/dist) is ignored;
          # only generated sources are compared.
          if ! git diff --exit-code; then
            echo "::error::generated files differ from the commit; run 'make generate' (and 'pnpm build' in web/) and commit the result"
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            exit 1
          fi

  web:
    name: Frontend (typecheck, lint, unit tests, i18n)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
      - name: zh-CN / en keys complete
        run: pnpm check:i18n
      - name: Version matches the backend
        run: |
          backend="$(sed -n 's/^const Version = "\(.*\)"/\1/p' ../backend/internal/version/version.go)"
          grep -q "APP_VERSION = \"$backend\"" src/lib/version.ts
          grep -q "\"version\": \"$backend\"" package.json

  e2e:
    name: Playwright smoke (fakecpa + seed data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BRIDGE_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      BRIDGE_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: ./scripts/e2e.sh --project=smoke
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  demo:
    name: Docker demo (compose up, API checks, Playwright smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build and start the demo (one command, as in the README)
        run: |
          # The same command a user runs, detached; --wait returns once
          # every service is healthy (seed must have exited 0 first).
          docker compose -f docker-compose.demo.yml up --build --detach --wait --wait-timeout 600

      - name: Services are in the expected state
        run: |
          docker compose -f docker-compose.demo.yml ps -a
          test "$(docker compose -f docker-compose.demo.yml ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' seed)" = "seed exited 0"
          for s in postgres redis fakecpa bridge; do
            health="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.demo.yml ps -q "$s")")"
            echo "$s: $health"
            test "$health" = healthy
          done

      - name: API checks (healthz, admin login, overview has accounts)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -c /tmp/jar -H 'Content-Type: application/json' -H 'X-Requested-With: ci' \
            -d '{"username":"admin","password":"admin-pass-123"}' http://localhost:8080/api/v1/auth/login > /dev/null
          overview="$(curl -fsS -b /tmp/jar http://localhost:8080/api/v1/admin/overview)"
          echo "$overview"
          total="$(echo "$overview" | jq '.accounts.total')"
          echo "accounts.total=$total"
          test "$total" -gt 0
          # Running the seed again is a no-op.
          docker compose -f docker-compose.demo.yml run --rm --no-deps seed 2>&1 | tee /tmp/seed-again.log
          grep -q "demo data already present" /tmp/seed-again.log

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Playwright smoke against the demo
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASSWORD: admin-pass-123
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=smoke

      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-demo
          path: web/playwright-report
          retention-days: 7

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v

  test:
    name: Test (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BRIDGE_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      BRIDGE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Anti-drift: migrate a schema with the pinned cpa-quota release's own
      # code, then TestUpstreamSchemaDrift compares it with schema.sql and
      # prepares every bridge query against it.
      - name: Read pinned cpa-quota commit
        id: cpaquota
        run: echo "sha=$(tr -d '[:space:]' < internal/cpaquota/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: sketchain/cpa-quota
          ref: ${{ steps.cpaquota.outputs.sha }}
          path: cpa-quota
          persist-credentials: false

      - name: Migrate a cpa-quota schema with the pinned release
        working-directory: cpa-quota
        run: |
          mkdir drift-migrate
          cp ../.github/cpa-quota-migrate/main.go drift-migrate/
          go run ./drift-migrate "$BRIDGE_TEST_DATABASE_URL" cpa_quota_upstream

      - name: go test -race
        env:
          BRIDGE_TEST_CPA_QUOTA_SCHEMA: cpa_quota_upstream
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/bridge ./cmd/bridge

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: actionlint
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
