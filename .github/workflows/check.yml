name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out instead of the triggering one.
        type: string
        default: ""
      expect_tag:
        description: When set, the code Version must equal this tag without its leading v.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  SQLC_VERSION: v1.31.1
  OAPI_CODEGEN_VERSION: v2.8.2
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Format, vet and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Code version matches the tag
        if: inputs.expect_tag != ''
        env:
          EXPECT_TAG: ${{ inputs.expect_tag }}
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
          test "v$version" = "$EXPECT_TAG"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run ./...

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: sqlc
        working-directory: backend
        run: go run "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}" generate

      - name: oapi-codegen
        working-directory: backend
        run: go run "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}" -config oapi-codegen.yaml ../api/openapi.yaml

      - name: TypeScript API types (openapi-typescript)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api

      - name: Route tree (TanStack Router)
        working-directory: web
        run: pnpm build

      - name: No diff
        run: |
          # The frontend build output (backend/internal/webui/dist) is ignored;
          # only generated sources are compared.
          if ! git diff --exit-code; then
            echo "::error::generated files differ from the commit; run 'make generate' (and 'pnpm build' in web/) and commit the result"
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            exit 1
          fi

  web:
    name: Frontend (typecheck, lint, unit tests, i18n)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
      - name: zh-CN / en keys complete
        run: pnpm check:i18n
      - name: Version matches the backend
        run: |
          backend="$(sed -n 's/^const Version = "\(.*\)"/\1/p' ../backend/internal/version/version.go)"
          grep -q "APP_VERSION = \"$backend\"" src/lib/version.ts
          grep -q "\"version\": \"$backend\"" package.json

  e2e:
    name: Playwright smoke (fakecpa + seed data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BRIDGE_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      BRIDGE_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests
        run: ./scripts/e2e.sh --project=smoke
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  test:
    name: Test (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BRIDGE_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      BRIDGE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/bridge ./cmd/bridge

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: actionlint
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
